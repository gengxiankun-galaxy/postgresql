---
# tasks file for postgres

- name: 清除旧容器
  shell: docker-compose -f {{ OPT_PATH }}/{{ POSTGRES_CONTAINER_NAME }}/docker-compose.yaml rm -fsva
  ignore_errors: true

- name: 删除部署目录
  file:
    path: "{{ OPT_PATH }}/{{ POSTGRES_CONTAINER_NAME }}"
    state: absent

- name: 预处理 - 创建部署目录
  shell: '[[ ! -d "{{ OPT_PATH }}/{{ POSTGRES_CONTAINER_NAME }}" ]] && mkdir -vp {{ OPT_PATH }}/{{ POSTGRES_CONTAINER_NAME }}'

- name: 编排 docker-compose.yaml
  template: src=docker-compose.yaml.j2 dest={{ OPT_PATH }}/{{ POSTGRES_CONTAINER_NAME }}/docker-compose.yaml

- name: 部署服务
  shell: 'docker-compose -f  {{ OPT_PATH }}/{{ POSTGRES_CONTAINER_NAME }}/docker-compose.yaml up -d'
